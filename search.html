<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Marisel Flix</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/kt6b64.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <a href="/" class="logo">
            <img src="https://files.catbox.moe/kt6b64.jpg" alt="Marisel Flix" class="logo-img">
            <div class="logo-text">
                <span>Marisel</span><span>Flix</span>
            </div>
        </a>
        <div style="width: 40px;"></div> <!-- Spacer for alignment -->
    </header>

    <!-- Search Page -->
    <div class="search-page">
        <div class="search-header">
            <a href="/" class="search-back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <input type="text" class="search-input" id="search-input" placeholder="Search movies and series...">
        </div>
        <div class="search-results" id="search-results">
            <p class="text-center mt-1">Type to search for movies and series</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
