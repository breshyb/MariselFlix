<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - Marisel Flix</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/kt6b64.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <a href="/" class="logo">
            <img src="https://files.catbox.moe/kt6b64.jpg" alt="Marisel Flix" class="logo-img">
            <div class="logo-text">
                <span>Marisel</span><span>Flix</span>
            </div>
        </a>
        <a href="/search" class="search-btn">
            <i class="fas fa-search"></i>
        </a>
    </header>

    <!-- Movie Details Page -->
    <div class="details-page">
        <div class="movie-details-header">
            <a href="/" class="details-back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <span>Movie Details</span>
        </div>
        <div class="movie-details-content" id="movie-details-content">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
